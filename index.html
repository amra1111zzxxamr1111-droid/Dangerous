<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W Company - منصة إدارة الرصيد</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 480px;
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 30px;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .brand {
        text-align: center;
        margin-bottom: 30px;
    }

    .brand .logo {
        font-size: 3rem;
        font-weight: 900;
        background: linear-gradient(45deg, #3b82f6, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -1px;
    }

    .brand p {
        color: #94a3b8;
        font-size: 0.9rem;
        margin-top: 5px;
    }

    .card {
        display: none;
    }

    h3 {
        font-size: 1.2rem;
        color: #f1f5f9;
        margin-bottom: 15px;
        font-weight: 600;
    }

    .input-group {
        margin-bottom: 15px;
    }

    input {
        width: 100%;
        padding: 12px 16px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        text-align: right;
    }

    input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
    }

    button:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    button.secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #f1f5f9;
        margin-top: 8px;
    }

    button.secondary:hover {
        background: rgba(255, 255, 255, 0.15);
    }

    button.social-btn {
        background: #ffffff;
        color: #1f2937;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 12px;
    }
    
    button.social-btn:hover {
        background: #f3f4f6;
        box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }

    button.facebook-btn {
        background: #1877f2;
        color: white;
    }

    button.facebook-btn:hover {
        background: #166fe5;
        box-shadow: 0 4px 12px rgba(24, 119, 242, 0.3);
    }

    button.danger {
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }

    button.danger:hover {
        box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
    }

    .balance-box {
        background: rgba(59, 130, 246, 0.1);
        border: 1px dashed rgba(59, 130, 246, 0.3);
        padding: 20px;
        border-radius: 16px;
        text-align: center;
        margin-bottom: 20px;
    }

    .balance-box span {
        display: block;
        font-size: 0.85rem;
        color: #94a3b8;
    }

    .balance-box h2 {
        font-size: 2.2rem;
        color: #3b82f6;
        font-weight: 700;
        margin-top: 5px;
    }

    .divider-container {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 20px 0;
        color: #64748b;
        font-size: 0.85rem;
    }

    .divider-container::before, .divider-container::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .divider-container:not(:empty)::before { margin-left: .25em; }
    .divider-container:not(:empty)::after { margin-right: .25em; }

    .divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
        margin: 20px 0;
    }

    .admin-badge {
        display: inline-block;
        padding: 4px 8px;
        background: rgba(139, 92, 246, 0.2);
        color: #a78bfa;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
        margin-bottom: 10px;
    }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut,
  GoogleAuthProvider,
  FacebookAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  get,
  child,
  update,
  push
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// تم ربط بيانات الـ Firebase الحقيقية الخاصة بك بنجاح 🎉
const firebaseConfig = {
  apiKey: "AIzaSyCTLNLYlJ5Y0e2N2a9F0iyQhW0rlC9R0qY",
  authDomain: "credit-followars.firebaseapp.com",
  databaseURL: "https://credit-followars-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "credit-followars",
  storageBucket: "credit-followars.firebasestorage.app",
  messagingSenderId: "211185964961",
  appId: "1:211185964961:web:74b08a74abab84d359dde0",
  measurementId: "G-JM36N6DDPS"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const googleProvider = new GoogleAuthProvider();
const fbProvider = new FacebookAuthProvider();

// ================= GOOGLE LOGIN =================
window.loginWithGoogle = function() {
    signInWithPopup(auth, googleProvider)
    .then(async (result) => {
        const user = result.user;
        const snap = await get(child(ref(db), 'users/' + user.uid));
        if (!snap.exists()) {
            await set(ref(db, 'users/' + user.uid), {
                credits: 4,
                role: "user"
            });
        }
    })
    .catch(e => alert("فشل تسجيل الدخول بجوجل: " + e.message));
}

// ================= FACEBOOK LOGIN =================
window.loginWithFacebook = function() {
    signInWithPopup(auth, fbProvider)
    .then(async (result) => {
        const user = result.user;
        const snap = await get(child(ref(db), 'users/' + user.uid));
        if (!snap.exists()) {
            await set(ref(db, 'users/' + user.uid), {
                credits: 4,
                role: "user"
            });
        }
    })
    .catch(e => alert("فشل تسجيل الدخول بفيسبوك: " + e.message));
}

// ================= EMAIL LOGIN =================
window.login = function(){
    let email = document.getElementById("email").value;
    let pass = document.getElementById("pass").value;
    if(!email || !pass) return alert("يرجى ملء جميع الحقول");

    signInWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message));
}

// ================= EMAIL REGISTER =================
window.register = function(){
    let email = document.getElementById("email").value;
    let pass = document.getElementById("pass").value;
    if(!email || !pass) return alert("يرجى ملء جميع الحقول");

    createUserWithEmailAndPassword(auth, email, pass)
    .then(user=>{
        set(ref(db,'users/'+user.user.uid),{
            credits: 4,
            role: "user"
        });
    })
    .catch(e => alert(e.message));
}

// ================= LOGOUT =================
window.logout = function(){
    signOut(auth);
}

// ================= STATE MANAGEMENT =================
onAuthStateChanged(auth, async (user)=>{
    const authCard = document.getElementById("auth-card");
    const appCard = document.getElementById("app-card");
    const adminSection = document.getElementById("admin-section");

    if(user){
        authCard.style.display = "none";
        appCard.style.display = "block";

        const snap = await get(child(ref(db),'users/'+user.uid));
        if(snap.exists()){
            const userData = snap.val();
            document.getElementById("credits-display").innerText = userData.credits;
            
            if(userData.role === "admin") {
                adminSection.style.display = "block";
            } else {
                adminSection.style.display = "none";
            }
        }
        window.currentUser = user;
    }else{
        authCard.style.display = "block";
        appCard.style.display = "none";
        adminSection.style.display = "none";
    }
});

// ================= ADD CREDITS =================
window.addCredits = async function(){
    if (!window.currentUser) return alert("غير مصرح لك");

    let uid = document.getElementById("uid").value;
    let amount = parseInt(document.getElementById("amount").value);

    if(!uid || isNaN(amount) || amount <= 0) {
        return alert("يرجى إدخال معرف مستخدم صحيح وكمية أكبر من الصفر");
    }

    const snap = await get(child(ref(db),'users/'+uid));

    if(snap.exists()){
        let current = snap.val().credits;

        try {
            await update(ref(db,'users/'+uid),{
                credits: current + amount
            });

            await push(ref(db,'transactions'),{
                to: uid,
                amount: amount,
                time: Date.now()
            });

            alert("تم إضافة الرصيد بنجاح 🎉");
            document.getElementById("uid").value = "";
            document.getElementById("amount").value = "";
        } catch (error) {
            alert("فشلت العملية: لا تملك صلاحيات مسؤول.");
        }
    } else {
        alert("المستخدم غير موجود");
    }
}
</script>
</head>

<body>

<div class="container">
    
    <div class="brand">
        <div class="logo">W</div>
        <p>منصة إدارة الأرصدة والتبادل الذكي</p>
    </div>

    <div id="auth-card" class="card">
        <h3>تسجيل الدخول إلى حسابك</h3>
        <div class="input-group">
            <input id="email" type="email" placeholder="البريد الإلكتروني">
        </div>
        <div class="input-group">
            <input id="pass" type="password" placeholder="كلمة المرور">
        </div>
        <button onclick="login()">تسجيل الدخول</button>
        <button onclick="register()" class="secondary">إنشاء حساب جديد</button>
        
        <div class="divider-container">أو عبر المنصات</div>
        
        <button onclick="loginWithGoogle()" class="social-btn">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v3.92h6.61c-.29 1.53-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-8.58z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.11 0-5.74-2.11-6.68-4.96H1.21v3.15C3.18 21.88 7.31 24 12 24z"/>
                <path fill="#FBBC05" d="M5.32 14.24A7.16 7.16 0 0 1 5 12c0-.79.13-1.57.32-2.34V6.51H1.21A11.94 11.94 0 0 0 0 12c0 1.92.45 3.74 1.21 5.39l4.11-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.18 2.12 1.21 5.39l4.11 3.15c.94-2.85 3.57-4.96 6.68-4.96z"/>
            </svg>
            المتابعة باستخدام Google
        </button>

        <button onclick="loginWithFacebook()" class="social-btn facebook-btn">
            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                <path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/>
            </svg>
            المتابعة باستخدام Facebook
        </button>
    </div>

    <div id="app-card" class="card">
        <div class="balance-box">
            <span>رصيدك الحالي من نقاط المتابعين</span>
            <h2 id="credits-display">..</h2>
        </div>
        <button onclick="logout()" class="danger">تسجيل الخروج</button>

        <div id="admin-section" style="display:none">
            <div class="divider"></div>
            <div class="admin-badge">لوحة الإدارة للشركة</div>
            <h3>تزويد نقاط لعضو</h3>
            <div class="input-group">
                <input id="uid" placeholder="معرف المستخدم (UID)">
            </div>
            <div class="input-group">
                <input id="amount" type="number" placeholder="كمية النقاط المضافة">
            </div>
            <button onclick="addCredits()">تأكيد شحن النقاط</button>
        </div>
    </div>

</div>

</body>
</html>
